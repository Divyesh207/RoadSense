# Shared Ruff configuration for services/api and services/ai-worker.
# Run from the repository root: `ruff check .`
extend-exclude = ["apps", "data", "infrastructure"]

[lint.isort]
# The worker imports the API's `app` package; classify both services' packages
# as first-party regardless of the directory Ruff is invoked from.
known-first-party = [
    "app",
    "tests",
    "tests_integration",
    "inference",
    "pipelines",
    "preprocessing",
    "postprocessing",
    "worker",
]

[lint.flake8-bugbear]
# FastAPI declares parameters through these call defaults by design (B008).
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]
