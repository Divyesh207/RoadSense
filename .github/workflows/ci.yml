name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: road_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt
          pip install pytest pytest-asyncio httpx ruff

      - name: Run Ruff Linter
        run: |
          ruff check services/api

      - name: Run Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/road_platform_test
          DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/road_platform_test
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: testing
          JWT_SECRET: test-secret-key-minimum-32-chars-long-for-testing
          SECRET_KEY: test-secret-key-minimum-32-chars-long-for-testing
        run: |
          pytest services/api/tests -v

      - name: Run PostGIS integration tests (real PostgreSQL 16 + PostGIS 3.4)
        working-directory: services/api
        env:
          POSTGIS_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/road_platform_it
          APP_ENV: testing
          JWT_SECRET: test-secret-key-minimum-32-chars-long-for-testing
          SECRET_KEY: test-secret-key-minimum-32-chars-long-for-testing
        run: |
          pip install "opencv-python-headless>=4.9.0,<5.0.0" "numpy>=1.26.4,<2.0.0"
          python -m pytest tests_integration -v

  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Run Build
        run: npm run build
